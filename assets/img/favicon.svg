<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WR.Forge icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2c3128"/>
      <stop offset="35%" stop-color="#4b5320"/>
      <stop offset="100%" stop-color="#788a48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#dfe9a3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dfe9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020302" flood-opacity="0.65"/>
    </filter>
    <clipPath id="logoClip">
      <rect x="12" y="12" width="40" height="40" rx="12"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#glow)" opacity="0.9"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#f2f2f2" stroke-opacity="0.65" stroke-width="1.6"/>

  <g filter="url(#shadow)" clip-path="url(#logoClip)">
    <image href="logo.jpg" x="0" y="0" width="64" height="64" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
